<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tally: paycheck budget</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#EAEFF3; --surface:#FFFFFF; --sunk:#F4F7F9; --ink:#15243A; --muted:#5A687B; --line:#D3DBE3;
  --accent:#17745A; --accent-ink:#FFFFFF; --warn:#B4442E; --amber:#A8741A;
  --shadow:0 1px 0 rgba(21,36,58,.06);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0F151D; --surface:#17202B; --sunk:#121A23; --ink:#E4EBF2; --muted:#94A3B5; --line:#283544;
    --accent:#47B98C; --accent-ink:#06150F; --warn:#E3806B; --amber:#D9A447; --shadow:none;
  }
}
:root[data-theme="dark"]{
  --bg:#0F151D; --surface:#17202B; --sunk:#121A23; --ink:#E4EBF2; --muted:#94A3B5; --line:#283544;
  --accent:#47B98C; --accent-ink:#06150F; --warn:#E3806B; --amber:#D9A447; --shadow:none;
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);
  font-family:"Figtree",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:16px;line-height:1.45;
  -webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%}
.num{font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;cursor:pointer}
input,select{font:inherit;font-size:16px;color:var(--ink)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{margin:0;line-height:1.2}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);}
.top-in{max-width:640px;margin:0 auto;display:flex;align-items:center;gap:8px;padding:12px 16px 10px}
.brand{font-weight:800;font-size:20px;letter-spacing:-.02em;margin-right:auto}
.brand b{color:var(--accent)}
.icon-btn{border:0;background:transparent;width:40px;height:40px;border-radius:12px;display:grid;place-items:center;color:var(--muted)}
.icon-btn:hover{background:var(--surface)}
.icon-btn svg{width:22px;height:22px}
.month{display:flex;align-items:center;gap:2px}
.month span{font-weight:600;min-width:9.5em;text-align:center}

main{max-width:640px;margin:0 auto;padding:4px 16px 112px}
section{margin-top:18px}
.card{background:var(--surface);border-radius:16px;padding:16px;box-shadow:var(--shadow)}
.muted{color:var(--muted)}
.small{font-size:14px}
.row{display:flex;align-items:center;gap:10px}
.sp{flex:1}
.h2{font-size:22px;font-weight:700;letter-spacing:-.015em}
.h3{font-size:16px;font-weight:700}

/* hero: the paycheck split */
.lead{font-size:19px;line-height:1.35;letter-spacing:-.01em;margin:6px 0 14px}
.lead strong{font-weight:700}
.left-big{font-size:44px;font-weight:800;letter-spacing:-.035em;line-height:1}
.left-big.neg{color:var(--warn)}
.split{display:flex;height:72px;border-radius:12px;overflow:hidden;gap:3px;margin:16px 0 6px}
.seg{position:relative;min-width:6px;background:var(--line);background:color-mix(in srgb,var(--c) 22%,var(--surface))}
.seg i{position:absolute;left:0;bottom:0;top:0;background:var(--c);transition:width .5s ease}
.seg.over i{background:repeating-linear-gradient(135deg,var(--c) 0 7px,color-mix(in srgb,var(--c) 70%,#000) 7px 11px)}
.seg.free{--c:var(--muted)}
.split-scale{display:flex;justify-content:space-between;font-size:13px;color:var(--muted)}

.cats{margin-top:6px}
.cat{padding:12px 0;border-top:1px solid var(--line)}
.cat:first-child{border-top:0}
.cat .row{align-items:baseline}
.dot{width:10px;height:10px;border-radius:3px;background:var(--c);flex:none;transform:translateY(-1px)}
.cat-name{font-weight:600}
.meter{height:6px;border-radius:3px;background:var(--sunk);margin-top:8px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--c);border-radius:3px}
.meter.over i{background:var(--warn)}
.pos{color:var(--accent)} .neg{color:var(--warn)}

.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.stats div{background:var(--sunk);border-radius:12px;padding:10px 12px}
.stats small{display:block;color:var(--muted);font-size:13px}
.stats b{font-size:17px}

/* spreadsheet tables */
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:0 -4px}
table.sheet{width:100%;border-collapse:collapse;font-size:15px}
table.sheet th{font-size:13px;font-weight:600;color:var(--muted);text-align:left;padding:8px;border-bottom:1px solid var(--line);white-space:nowrap}
table.sheet td{padding:11px 8px;border-bottom:1px solid var(--line);vertical-align:top}
table.sheet tr[data-act]{cursor:pointer}
table.sheet tr[data-act]:hover td{background:var(--sunk)}
table.sheet .r{text-align:right;white-space:nowrap}
table.sheet .d{white-space:nowrap;color:var(--muted)}
table.sheet tfoot td{font-weight:700;border-bottom:0}
.tag{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);white-space:nowrap}
.tag.none{color:var(--amber);font-weight:600}

.btn{border:0;border-radius:12px;padding:11px 16px;font-weight:600;background:var(--sunk);color:var(--ink);display:inline-flex;align-items:center;gap:8px;justify-content:center}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.danger{background:var(--warn);color:#fff}
.btn.quiet{background:transparent;color:var(--accent);padding:8px 4px}
.btn.quiet.danger-t{color:var(--warn)}
.btn.block{width:100%}
.btn svg{width:18px;height:18px}
.btns{display:flex;gap:8px;flex-wrap:wrap}

.empty{text-align:center;padding:28px 12px}
.empty p{margin:0 0 14px;color:var(--muted)}

/* plan editor */
.pl{display:grid;grid-template-columns:auto 1fr 76px auto;align-items:center;gap:8px 10px;padding:10px 0;border-top:1px solid var(--line)}
.pl:first-child{border-top:0}
.pl input.nm{border:1px solid transparent;background:transparent;padding:6px 8px;border-radius:8px;width:100%;font-weight:600;min-width:0}
.pl input.nm:focus{border-color:var(--line);background:var(--sunk)}
.pct{display:flex;align-items:center;background:var(--sunk);border-radius:8px;padding:0 8px}
.pct input{width:100%;border:0;background:transparent;padding:7px 0;text-align:right}
.pl .amt{grid-column:2/4;font-size:13px;color:var(--muted);padding-left:8px;margin-top:-8px}
.pl2{padding:12px 0;border-top:1px solid var(--line)}
.pl2:first-child{border-top:0}
.pl2 input.nm{border:1px solid transparent;background:transparent;padding:6px 8px;border-radius:8px;flex:1;font-weight:600;min-width:0}
.pl2 input.nm:focus{border-color:var(--line);background:var(--sunk)}
.pl-ctl{display:grid;grid-template-columns:1fr 118px;gap:8px;margin:4px 0 0 20px}
.pl-ctl select{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--sunk)}
.pl-ctl .pct input{text-align:right}
.pl-sub{margin:6px 0 0 28px;font-size:13px;color:var(--muted)}
.pl-var{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:8px 0 0 20px;font-size:14px}
.pl-var .pct{width:118px}
.pl-var .pct input{text-align:right}
.mode-tag{font-size:12px;color:var(--muted);font-weight:500}
.total{margin-top:12px;padding:10px 12px;border-radius:10px;background:var(--sunk);font-size:14px}
.total.bad{color:var(--warn)}
.field-inline{display:flex;align-items:center;gap:10px;margin-top:10px}
.field-inline input{flex:1;min-width:0}

/* tabs */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs-in{max-width:640px;margin:0 auto;display:flex}
.tabs button{flex:1;border:0;background:transparent;padding:8px 2px 9px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;color:var(--muted);font-weight:500}
.tabs button svg{width:22px;height:22px}
.tabs button[aria-current="page"]{color:var(--accent);font-weight:700}

/* sheets */
.overlay{position:fixed;inset:0;z-index:30;background:rgba(8,16,26,.5);display:flex;align-items:flex-end;justify-content:center}
.panel{background:var(--surface);width:100%;max-width:560px;border-radius:20px 20px 0 0;
  padding:20px 18px calc(18px + env(safe-area-inset-bottom,0px));max-height:90%;overflow-y:auto;animation:up .22s ease}
@keyframes up{from{transform:translateY(24px);opacity:.4}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.panel{animation:none}.seg i{transition:none}}
@media (min-width:700px){.overlay{align-items:center}.panel{border-radius:20px}}
.panel h2{font-size:20px;margin-bottom:14px}
.panel h3{font-size:15px;margin:18px 0 6px}
.f{display:block;margin-bottom:12px}
.f span{display:block;font-size:14px;font-weight:600;margin-bottom:5px}
.f input,.f select{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--sunk)}
.chk{display:flex;gap:10px;align-items:flex-start;margin:10px 0;font-size:15px}
.chk input{width:20px;height:20px;margin:1px 0 0}
.sheet-btns{display:flex;gap:8px;margin-top:16px;align-items:center}
.err{color:var(--warn);font-size:14px;min-height:1em;margin:8px 0 0}
.splitlist{margin:0;padding:0;list-style:none}
.splitlist li{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line)}
.splitlist li:first-child{border-top:0}

/* lock */
#lock{position:fixed;inset:0;z-index:50;background:var(--bg);display:none;align-items:center;justify-content:center;padding:24px}
#lock.on{display:flex}
#lock .box{width:100%;max-width:340px;text-align:center}
#lock input{width:100%;padding:14px;border-radius:12px;border:1px solid var(--line);background:var(--surface);text-align:center;font-size:20px;letter-spacing:.2em;margin:18px 0 10px}

#toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:40;
  background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90%}
#toast.on{opacity:1}
.spark{width:100%;height:64px;display:block;margin-top:10px}
.acct{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line);cursor:pointer}
.acct:first-child{border-top:0}
.acct .n{font-weight:600}
.note{font-size:14px;color:var(--muted);margin-top:12px}
.hidden{display:none!important}

/* segmented */
.seg-ctl{display:flex;background:var(--surface);border-radius:12px;padding:4px;gap:4px;box-shadow:var(--shadow)}
.seg-ctl button{flex:1;border:0;background:transparent;padding:9px;border-radius:9px;font-weight:600;color:var(--muted)}
.seg-ctl button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}

/* 90 day run */
.run-day{font-size:64px;font-weight:800;letter-spacing:-.045em;line-height:.9}
.run-day small{font-size:22px;font-weight:600;color:var(--muted);letter-spacing:-.01em;margin-left:4px}
.grid90{display:grid;grid-template-columns:repeat(15,1fr);gap:4px;margin:18px 0 8px}
.grid90 button{aspect-ratio:1;border:0;border-radius:4px;padding:0;background:var(--sunk);box-shadow:inset 0 0 0 1px var(--line)}
.grid90 .clean{background:var(--accent);box-shadow:none}
.grid90 .slip{background:var(--warn);box-shadow:none;opacity:.85}
.grid90 .miss{background:var(--line);box-shadow:none}
.grid90 .today{box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--ink)}
.grid90 .future{cursor:default;opacity:.6}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
.bigbar{height:14px;border-radius:7px;background:var(--sunk);overflow:hidden;position:relative;margin-top:10px}
.bigbar i{display:block;height:100%;background:var(--accent);border-radius:7px}
.bigbar b{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink)}
.chart{width:100%;height:auto;display:block;margin-top:10px}
.chart text{font-family:inherit;font-size:10px;fill:var(--muted)}
.wk td:first-child{white-space:nowrap}
.rule-row{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line);font-size:15px}
.rule-row:first-child{border-top:0}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:-4px 0 12px}
.chips button{border:1px solid var(--line);background:var(--sunk);border-radius:20px;padding:6px 12px;font-size:14px;font-weight:600}
.pill{display:inline-block;font-size:12px;font-weight:700;padding:3px 9px;border-radius:20px;background:var(--sunk)}
.pill.ok{color:var(--accent)} .pill.bad{color:var(--warn)} .pill.done{background:var(--accent);color:var(--accent-ink)}
.goal{cursor:pointer}
.goal+.goal{margin-top:10px}
.back{border:0;background:transparent;color:var(--accent);font-weight:600;padding:6px 0;display:inline-flex;align-items:center;gap:4px}
.stats.two{grid-template-columns:repeat(2,1fr)}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.brow{display:grid;grid-template-columns:1.15fr 1fr;gap:8px;margin-bottom:8px;align-items:center}
.brow input[type=date]{width:100%;min-width:0;padding:9px 10px;border:1px solid var(--line);border-radius:10px;background:var(--sunk)}
.brow .pct input{text-align:left;padding-left:4px}
.bulk-head{display:grid;grid-template-columns:1.15fr 1fr;gap:8px;font-size:13px;font-weight:600;color:var(--muted);margin:14px 0 6px}
.bulk-tot{display:flex;justify-content:space-between;padding:10px 12px;background:var(--sunk);border-radius:10px;font-weight:700;margin-top:6px}
</style>
<style id="demo-bar-css">
#demo-bar{position:relative;z-index:50;display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px;
 padding:calc(8px + env(safe-area-inset-top,0px)) 14px 8px;background:#1d3557;color:#f1f4f8;
 font:500 13px/1.35 system-ui,-apple-system,"Segoe UI",sans-serif}
#demo-bar span{flex:1 1 auto}
#demo-bar a,#demo-bar button{color:#f1f4f8;background:transparent;border:1px solid rgba(241,244,248,.45);
 border-radius:6px;padding:5px 10px;font:inherit;cursor:pointer;text-decoration:none}
#demo-bar a:hover,#demo-bar button:hover{background:rgba(241,244,248,.12)}
#demo-bar :focus-visible{outline:2px solid #f2c14e;outline-offset:2px}
</style>
</head>
<body>
<div id="demo-bar" role="note"><span>Demo with sample data. Changes stay in your browser.</span>
<button type="button" onclick="try{Object.keys(localStorage).filter(function(k){return k.indexOf('tally.demo')===0}).forEach(function(k){localStorage.removeItem(k)})}catch(e){};location.reload()">Reset demo</button>
<a href="../../" target="_top" class="demo-home">Back to portfolio</a></div>
<script>try{if(window.top!==window.self){var h=document.querySelector('#demo-bar .demo-home');if(h)h.remove();}}catch(e){}</script>

<header class="top"><div class="top-in">
  <div class="brand">Tally<b>.</b></div>
  <div class="month" id="monthNav">
    <button class="icon-btn" data-act="prevM" aria-label="Previous month"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></button>
    <span id="monthLabel"></span>
    <button class="icon-btn" data-act="nextM" aria-label="Next month"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg></button>
  </div>
  <button class="icon-btn" data-act="settings" aria-label="Settings and privacy"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="10" width="16" height="11" rx="2.5"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg></button>
</div></header>

<main id="view"></main>

<nav class="tabs" aria-label="Sections"><div class="tabs-in">
  <button data-act="tab" data-v="overview"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="6" rx="2"/><path d="M3 15h18M3 20h11"/></svg>Month</button>
  <button data-act="tab" data-v="money"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M8 20V5M4 9l4-4 4 4M16 4v15M12 15l4 4 4-4"/></svg>Money</button>
  <button data-act="tab" data-v="plan"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8"/><path d="M12 4v8l6 4"/></svg>Plan</button>
  <button data-act="tab" data-v="run"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="16" height="16" rx="3"/><path d="M8 9h2M14 9h2M8 13h2M14 13h2M8 17h2"/></svg>90 Day</button>
  <button data-act="tab" data-v="goals"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="4"/><circle cx="12" cy="12" r=".6" fill="currentColor"/></svg>Goals</button>
  <button data-act="tab" data-v="worth"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19l5-6 4 3 7-9"/><path d="M15 7h5v5"/></svg>Worth</button>
</div></nav>

<div id="lock" role="dialog" aria-modal="true" aria-labelledby="lockTitle">
  <div class="box">
    <div class="brand" style="font-size:28px;margin:0">Tally<b>.</b></div>
    <p class="muted" id="lockTitle" style="margin:8px 0 0">Enter your passcode to unlock your budget.</p>
    <input id="lockInput" type="password" autocomplete="current-password" aria-label="Passcode">
    <button class="btn primary block" data-act="unlock">Unlock</button>
    <p class="err" id="lockErr"></p>
    <button class="btn quiet danger-t" data-act="forgot" style="margin-top:20px">Forgot passcode</button>
  </div>
</div>

<input type="file" id="csvFile" accept=".csv,text/csv" class="hidden">
<input type="file" id="backupFile" accept=".json,application/json" class="hidden">
<div id="toast" role="status" aria-live="polite"></div>

<script>
(function(){
"use strict";
const STORE_KEY = "tally.demo.v1";
const COLORS = ["#2F6690","#17745A","#B8862B","#8E5572","#4F7A94","#3F8F6B","#6A56B0","#B4442E","#5E8C82","#9C6B30","#3C6E8F","#A0527A"];
const PRESETS = {
  simple: [["Needs",50],["Wants",30],["Savings & debt payoff",20]],
  detailed: [["Housing",28],["Groceries",10],["Transportation",10],["Bills & utilities",7],["Dining & fun",15],["Emergency savings",15],["Investing",10],["Giving",5]]
};
const ACCT_TYPES = {"Checking":"asset","Savings":"asset","Brokerage (e.g. Robinhood)":"asset","Retirement (401k / IRA)":"asset","Crypto":"asset","Cash":"asset","Home / property":"asset","Vehicle":"asset","Other asset":"asset","Credit card":"debt","Student loan":"debt","Car loan":"debt","Mortgage":"debt","Other debt":"debt"};

const S = { data:null, key:null, salt:null, pending:null, view:"overview", sub:"income", goalId:null, month:"", t:null, hiddenAt:0 };
const hasCrypto = !!(window.crypto && crypto.subtle);
const enc = new TextEncoder(), dec = new TextDecoder();
const dlPromise = (window.claude && typeof window.claude.use === "function") ? window.claude.use("downloads").catch(()=>null) : Promise.resolve(null);

/* ---------- helpers ---------- */
const $ = (s,el=document)=>el.querySelector(s);
const esc = s => String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt = new Intl.NumberFormat("en-US",{style:"currency",currency:"USD"});
const money = n => fmt.format(Math.round((+n||0)*100)/100);
const uid = () => Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const pad = n => String(n).padStart(2,"0");
const isoOf = d => d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const today = () => isoOf(new Date());
const ymOf = iso => String(iso||"").slice(0,7);
const sum = (a,f=x=>x.amount) => a.reduce((t,x)=>t+(+f(x)||0),0);
function monthLabel(ym){const [y,m]=ym.split("-").map(Number);return new Date(y,m-1,1).toLocaleDateString("en-US",{month:"long",year:"numeric"});}
function shiftMonth(ym,d){let [y,m]=ym.split("-").map(Number);m+=d;while(m<1){m+=12;y--}while(m>12){m-=12;y++}return y+"-"+pad(m);}
function shortDate(iso){const [y,m,d]=String(iso).split("-").map(Number);if(!y)return iso;return new Date(y,m-1,d).toLocaleDateString("en-US",{month:"short",day:"numeric"});}
function parseMoney(s){
  if(typeof s==="number") return s;
  let t=String(s||"").trim(); let neg=false;
  if(/^\(.*\)$/.test(t)){neg=true;t=t.slice(1,-1);}
  t=t.replace(/[$,\s]/g,"");
  if(t.startsWith("-")){neg=!neg;t=t.slice(1);}
  const n=parseFloat(t); if(isNaN(n)) return NaN;
  return neg?-n:n;
}
function parseDate(s){
  s=String(s||"").trim();
  let m=s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/); if(m) return m[1]+"-"+pad(m[2])+"-"+pad(m[3]);
  m=s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{2,4})/); if(m){let y=m[3].length===2?"20"+m[3]:m[3];return y+"-"+pad(m[1])+"-"+pad(m[2]);}
  const d=new Date(s); return isNaN(d)?"":isoOf(d);
}
function dnum(iso){const [y,m,d]=String(iso).split("-").map(Number);return Math.round(Date.UTC(y,m-1,d)/864e5);}
function addDays(iso,n){return new Date((dnum(iso)+n)*864e5).toISOString().slice(0,10);}
function longDate(iso){const [y,m,d]=String(iso).split("-").map(Number);return new Date(y,m-1,d).toLocaleDateString("en-US",{month:"short",day:"numeric",year:"numeric"});}
function toast(msg){const t=$("#toast");t.textContent=msg;t.classList.add("on");clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove("on"),2400);}
function catById(id){return S.data.categories.find(c=>c.id===id);}
function nextColor(){const used=new Set(S.data.categories.map(c=>c.color));return COLORS.find(c=>!used.has(c))||COLORS[S.data.categories.length%COLORS.length];}
function makeCats(p){return PRESETS[p].map(([name,pct],i)=>({id:uid(),name,pct,color:COLORS[i%COLORS.length]}));}

/* ---------- storage (this device only) ---------- */
function freshData(){return {v:1,income:[],expenses:[],categories:makeCats("detailed"),accounts:[],history:[],expected:0,run:null,pastRuns:[],goals:[]};}
function migrate(o){
  const d=Object.assign(freshData(),o||{});
  ["income","expenses","accounts","history","pastRuns","goals"].forEach(k=>{if(!Array.isArray(d[k]))d[k]=[];});
  if(!Array.isArray(d.categories))d.categories=makeCats("detailed");
  return d;
}
function readRaw(){try{return localStorage.getItem(STORE_KEY);}catch(e){return null;}}
function writeRaw(s){try{localStorage.setItem(STORE_KEY,s);return true;}catch(e){toast("Couldn't save on this device. Export a backup from the lock menu.");return false;}}
function b64(buf){const u=new Uint8Array(buf);let s="";for(let i=0;i<u.length;i+=0x8000)s+=String.fromCharCode.apply(null,u.subarray(i,i+0x8000));return btoa(s);}
function unb64(s){const b=atob(s);const u=new Uint8Array(b.length);for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u;}
async function deriveKey(pass,salt){
  const base=await crypto.subtle.importKey("raw",enc.encode(pass),"PBKDF2",false,["deriveKey"]);
  return crypto.subtle.deriveKey({name:"PBKDF2",salt,iterations:310000,hash:"SHA-256"},base,{name:"AES-GCM",length:256},false,["encrypt","decrypt"]);
}
async function persist(){
  if(!S.data) return;
  if(S.key){
    const iv=crypto.getRandomValues(new Uint8Array(12));
    const ct=await crypto.subtle.encrypt({name:"AES-GCM",iv},S.key,enc.encode(JSON.stringify(S.data)));
    writeRaw(JSON.stringify({enc:true,v:1,salt:b64(S.salt),iv:b64(iv),data:b64(ct)}));
  } else writeRaw(JSON.stringify(S.data));
  setLocalTs(Date.now()); cloudPush();
}
function save(){clearTimeout(S.t);S.t=setTimeout(()=>{S.t=null;persist();},200);}
async function flush(){if(S.t){clearTimeout(S.t);S.t=null;}await persist();}

function load(){
  const raw=readRaw();
  let obj=null; if(raw){try{obj=JSON.parse(raw);}catch(e){obj=null;}}
  if(obj&&obj.enc){S.pending=obj;S.data=null;S.key=null;showLock();return;}
  S.data=migrate(obj); render();
}
function showLock(){$("#lock").classList.add("on");$("#lockErr").textContent="";$("#lockInput").value="";setTimeout(()=>$("#lockInput").focus(),50);}
async function unlock(){
  const pass=$("#lockInput").value; if(!pass){$("#lockErr").textContent="Type your passcode.";return;}
  if(!hasCrypto){$("#lockErr").textContent="This browser can't decrypt data.";return;}
  try{
    const salt=unb64(S.pending.salt), iv=unb64(S.pending.iv);
    const key=await deriveKey(pass,salt);
    const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv},key,unb64(S.pending.data));
    S.data=migrate(JSON.parse(dec.decode(pt))); S.key=key; S.salt=salt; S.pending=null;
    $("#lock").classList.remove("on"); render();
  }catch(e){$("#lockErr").textContent="That passcode doesn't match. Try again.";}
}
async function lockNow(){await flush();S.data=null;S.key=null;S.salt=null;closeSheet();load();}

/* ---------- derived numbers ---------- */
const monthIncome=()=>S.data.income.filter(i=>ymOf(i.date)===S.month);
const monthExp=()=>S.data.expenses.filter(e=>ymOf(e.date)===S.month);
function basis(){const inc=sum(monthIncome());return inc>0?{amt:inc,src:"actual"}:{amt:+S.data.expected||0,src:"expected"};}
function spentBy(){const m={};for(const e of monthExp()){const k=catById(e.category)?e.category:"";m[k]=(m[k]||0)+(+e.amount||0);}return m;}
const catMode=c=>c.mode||"pct";
function totalPct(){return S.data.categories.filter(c=>catMode(c)==="pct").reduce((t,c)=>t+(+c.pct||0),0);}
function avgSpend(id,ym){let tot=0,n=0;for(let k=1;k<=3;k++){const m=shiftMonth(ym,-k);const v=sum(S.data.expenses.filter(e=>e.category===id&&ymOf(e.date)===m));if(v>0){tot+=v;n++;}}return n?tot/n:0;}
function dollarAmt(c,ym){
  if(catMode(c)==="fixed") return +c.amount||0;
  const o=c.over&&c.over[ym]; if(o!=null&&o!=="") return +o;
  return (+c.amount>0)?+c.amount:avgSpend(c.id,ym);
}
function planFor(income,ym){
  const t={}; let bills=0;
  for(const c of S.data.categories) if(catMode(c)!=="pct"){t[c.id]=dollarAmt(c,ym);bills+=t[c.id];}
  const left=Math.max(0,income-bills), pc=S.data.categories.filter(c=>catMode(c)==="pct");
  for(const c of pc) t[c.id]=left*(+c.pct||0)/100;
  const assigned=Object.values(t).reduce((a,b)=>a+b,0);
  return {t,bills,left,short:Math.max(0,bills-income),pctCount:pc.length,pctTot:totalPct(),free:Math.max(0,income-assigned),assigned};
}
function worth(){let a=0,d=0;for(const x of S.data.accounts){if(ACCT_TYPES[x.type]==="debt")d+=+x.balance||0;else a+=+x.balance||0;}return {assets:a,debts:d,net:a-d};}
function snapshot(){const n=worth().net;const t=today();S.data.history=S.data.history.filter(h=>h.date!==t);S.data.history.push({date:t,net:n});S.data.history.sort((a,b)=>a.date<b.date?-1:1);if(S.data.history.length>500)S.data.history=S.data.history.slice(-500);}

function splitBar(b,by){
  const P=planFor(b.amt,S.month), cats=S.data.categories.filter(c=>P.t[c.id]>0), free=P.free;
  let h='<div class="split" role="img" aria-label="How this month\'s income splits across your plan, filled by what you\'ve spent">';
  for(const c of cats){
    const target=P.t[c.id], spent=by[c.id]||0, fill=target>0?Math.min(1,spent/target):0;
    h+=`<div class="seg${spent>target&&target>0?" over":""}" style="flex:${target.toFixed(2)};--c:${esc(c.color)}" title="${esc(c.name)}"><i style="width:${(fill*100).toFixed(1)}%"></i></div>`;
  }
  if(free>0) h+=`<div class="seg free" style="flex:${free.toFixed(2)}" title="Not assigned"></div>`;
  return h+'</div>';
}

  </div>`;}).join("");

  <p class="note">Tip: when you move money into savings or Robinhood, log it as an expense in that category. That's how you'll see you hit the goal.</p>`;

function splitList(amt){
  const base=Math.max(basis().amt,+S.data.expected||0,amt), P=planFor(base,S.month), r=amt/base;
  const hasBills=P.bills>0;

function spark(){
  const h=S.data.history; if(h.length<2) return '<p class="small muted" style="margin:8px 0 0">Your trend line appears after balances change on a second day.</p>';
  const vals=h.map(x=>x.net), min=Math.min(...vals), max=Math.max(...vals), span=(max-min)||1;
  const pts=vals.map((v,i)=>[(i/(vals.length-1))*300,56-((v-min)/span)*50]);
  const d=pts.map((p,i)=>(i?"L":"M")+p[0].toFixed(1)+" "+p[1].toFixed(1)).join(" ");
  const up=vals[vals.length-1]>=vals[0];
  return `<svg class="spark" viewBox="0 0 300 60" preserveAspectRatio="none" role="img" aria-label="Net worth trend since ${shortDate(h[0].date)}"><path d="${d}" fill="none" stroke="${up?"var(--accent)":"var(--warn)"}" stroke-width="2.5" vector-effect="non-scaling-stroke" stroke-linejoin="round"/></svg>

const RUN_RULES=["No eating out or fast food","No online shopping or impulse buys","Only pay bills and necessities","No new clothes, repeat outfits","No hair, nails or lashes appointments","No going out","Work out at least 3 times a week","Pick up extra income (overtime, side hustle)"];
const runDay=r=>dnum(today())-dnum(r.start)+1;
function weekRange(r,i){return [addDays(r.start,i*7),addDays(r.start,Math.min(89,i*7+6))];}
function runTotals(r){let saved=0,job=0,hustle=0,splurge=0;for(const k in r.weeks){const w=r.weeks[k];saved+=+w.saved||0;job+=+w.job||0;hustle+=+w.hustle||0;splurge+=+w.splurge||0;}return {saved,job,hustle,earned:job+hustle,splurge};}
function dayState(r,iso){const d=r.days[iso];if(!d)return null;return r.rules.every(x=>(d.kept||[]).includes(x.id))?"clean":"slip";}
function streaks(r){const day=Math.min(90,runDay(r));let best=0,cur=0;for(let i=0;i<day;i++){const st=dayState(r,addDays(r.start,i));if(st==="clean"){cur++;best=Math.max(best,cur);}else if(i<day-1||st)cur=0;}return {cur,best};}
function inRange(list,a,b){return sum(list.filter(x=>x.date>=a&&x.date<=b));}

  </section>

    <div class="bigbar" aria-hidden="true"><i style="width:${pct.toFixed(1)}%"></i><b style="left:${Math.min(100,d/90*100).toFixed(1)}%"></b></div>
    <p class="small" style="margin:10px 0 0">${done?`You saved ${Math.round(pct)}% of your target.`:diff>=0?`<span class="pos">You're ${money(diff)} ahead of pace.</span> The black line is where you'd be saving evenly.`:`<span class="neg">You're ${money(-diff)} behind pace.</span> Save about ${money(needWk)} a week from here to hit ${money(r.target)}.`}</p>

function barChart(vals,target,cur){
  const W=320,H=130,L=6,B=18,top=8,max=Math.max(target,...vals)*1.1||1,bw=(W-L*2)/vals.length;
  const y=v=>H-B-(v/max)*(H-B-top);
  let g="";
  vals.forEach((v,i)=>{const x=L+i*bw+3,h=H-B-y(v);g+=`<rect x="${x.toFixed(1)}" y="${y(v).toFixed(1)}" width="${(bw-6).toFixed(1)}" height="${Math.max(0,h).toFixed(1)}" rx="3" fill="${v>=target&&v>0?"var(--accent)":"color-mix(in srgb,var(--accent) 45%,var(--surface))"}" opacity="${i>cur?.35:1}"/><text x="${(x+(bw-6)/2).toFixed(1)}" y="${H-5}" text-anchor="middle">${i+1}</text>`;});
  g+=`<line x1="${L}" x2="${W-L}" y1="${y(target).toFixed(1)}" y2="${y(target).toFixed(1)}" stroke="var(--ink)" stroke-dasharray="4 4" stroke-width="1.2"/>`;
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Bar chart of savings per week against a dashed weekly target line">${g}</svg>`;
}

/* ---------- goals ---------- */
const goalSaved=g=>(+g.start||0)+sum(g.contribs||[]);
function goalStats(g){
  const saved=goalSaved(g), left=Math.max(0,g.target-saved), pct=g.target>0?Math.min(100,Math.max(0,saved/g.target*100)):0;
  const t=dnum(today()), daysLeft=g.date?dnum(g.date)-t:null;
  const added=sum(g.contribs||[]), months=Math.max(1,(t-dnum(g.created))/30.44), perMonth=added/months;
  const needWeek=daysLeft>0?left/(daysLeft/7):null, needMonth=daysLeft>0?left/(daysLeft/30.44):null;
  const proj=left<=0?today():perMonth>0?addDays(today(),Math.ceil(left/perMonth*30.44)):null;
  let status="none";
  if(left<=0) status="done"; else if(g.date&&daysLeft<0) status="late"; else if(g.date) status=proj&&dnum(proj)<=dnum(g.date)?"ok":"behind";
  return {saved,left,pct,daysLeft,perMonth,needWeek,needMonth,proj,status};
}
const statusPill=s=>({done:'<span class="pill done">Reached</span>',ok:'<span class="pill ok">On track</span>',behind:'<span class="pill bad">Behind</span>',late:'<span class="pill bad">Past date</span>',none:""}[s]);
function vGoals(){

function goalChart(g,cs){
  const W=320,H=150,L=4,R=4,T=10,B=20;
  const x0=dnum(g.created), last=cs.length?dnum(cs[cs.length-1].date):x0;
  const x1=Math.max(g.date?dnum(g.date):0,dnum(today()),last,x0+30);
  const ymax=Math.max(g.target,goalSaved(g))*1.08||1;
  const X=d=>L+(d-x0)/(x1-x0)*(W-L-R), Y=v=>H-B-(v/ymax)*(H-B-T);
  let v=+g.start||0, d=`M${X(x0).toFixed(1)} ${Y(v).toFixed(1)}`;
  for(const c of cs){const dx=Math.max(x0,dnum(c.date));d+=` H${X(dx).toFixed(1)}`;v+=+c.amount;d+=` V${Y(v).toFixed(1)}`;}
  d+=` H${X(dnum(today())).toFixed(1)}`;
  const ideal=g.date?`<line x1="${X(x0)}" y1="${Y(+g.start||0)}" x2="${X(dnum(g.date))}" y2="${Y(g.target)}" stroke="var(--muted)" stroke-dasharray="4 4" stroke-width="1.2"/>`:"";
  const tgt=`<line x1="${L}" x2="${W-R}" y1="${Y(g.target)}" y2="${Y(g.target)}" stroke="var(--line)" stroke-width="1"/><text x="${W-R}" y="${Y(g.target)-4}" text-anchor="end">Target ${money(g.target).replace(".00","")}</text>`;
  const tx=X(dnum(today()));
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Balance over time${g.date?", with a dashed line showing the even pace to the target date":""}">
    ${tgt}${ideal}<path d="${d}" fill="none" stroke="${esc(g.color)}" stroke-width="2.5" stroke-linejoin="round"/>
    <line x1="${tx}" x2="${tx}" y1="${T}" y2="${H-B}" stroke="var(--line)"/>
    <text x="${L}" y="${H-5}">${shortDate(g.created)}</text><text x="${Math.min(W-R,Math.max(L+40,tx))}" y="${H-5}" text-anchor="${tx>W-40?"end":"middle"}">Today</text>
    ${g.date&&X(dnum(g.date))>tx+40?`<text x="${W-R}" y="${H-5}" text-anchor="end">${shortDate(g.date)}</text>`:""}</svg>
  <div class="legend" style="margin-top:4px"><span><i style="background:${esc(g.color)}"></i>Your balance</span>${g.date?'<span><i style="background:var(--muted)"></i>Even pace to your date</span>':""}</div>`;
}

/* ---------- bulk paychecks ---------- */
function addMonths(iso,n){const [y,m,d]=iso.split("-").map(Number);const t=new Date(Date.UTC(y,m-1+n,1));const last=new Date(Date.UTC(t.getUTCFullYear(),t.getUTCMonth()+1,0)).getUTCDate();return t.getUTCFullYear()+"-"+pad(t.getUTCMonth()+1)+"-"+pad(Math.min(d,last));}
function monthEnd(ym){const [y,m]=ym.split("-").map(Number);return y+"-"+pad(m)+"-"+pad(new Date(y,m,0).getDate());}
const BULK_MAX=93;
function genDates(freq,from,to){
  const out=[];if(!from||!to||to<from)return out;
  for(let i=0;out.length<=BULK_MAX;i++){
    const d=freq==="day"?addDays(from,i):freq==="week"?addDays(from,7*i):freq==="2week"?addDays(from,14*i):addMonths(from,i);
    if(d>to)break; out.push(d);
  }
  return out;
}
function bulkDefaults(freq){
  if(freq==="month") return [S.month.slice(0,4)+"-01-01",S.month+"-01"];
  return [S.month+"-01",monthEnd(S.month)];
}
function bulkPaySheet(){
  const sources=[...new Set(S.data.income.map(i=>i.source).filter(Boolean))];
  const [f,t]=bulkDefaults("week");
  sheet({title:"Add several paychecks",
    body:`<p class="muted" style="margin:0 0 12px">Pick how you want to log, set the dates, and fill in the amounts like a spreadsheet. Rows left blank are skipped.</p>`+
      field("Log by",`<select name="freq" data-chg="bulkFreq"><option value="day">Day</option><option value="week" selected>Week</option><option value="2week">Every 2 weeks</option><option value="month">Month</option></select>`)+
      `<div class="two-col">${field("From",`<input name="from" type="date" value="${f}" data-chg="bulk">`)}${field("To",`<input name="to" type="date" value="${t}" data-chg="bulk">`)}</div>`+
      field("From (employer or gig)",`<input name="source" list="srcs2" placeholder="Employer or side gig" value="${esc(sources[0]||"")}"><datalist id="srcs2">${sources.map(x=>`<option value="${esc(x)}">`).join("")}</datalist>`)+
      `<div class="field-inline"><div class="pct" style="flex:1"><span class="muted">$</span><input id="bulkSame" inputmode="decimal" placeholder="Same amount for every row" style="text-align:left;padding-left:4px"></div><button class="btn" data-act="bulkFill">Fill all</button></div>
      <div class="bulk-head"><span>Date</span><span>Take-home</span></div><div id="bulkRows"></div>
      <div class="bulk-tot num"><span id="bulkCount">0 paychecks</span><span id="bulkTot">$0.00</span></div>`,
    primary:"Add paychecks",
    onSave:v=>{
      const recs=[];
      for(let i=0;v["d_"+i]!==undefined;i++){
        const raw=String(v["a_"+i]||"").trim(); if(!raw) continue;
        const a=parseMoney(raw); if(!(a>0)) return `Row ${i+1} has an amount that isn't a number.`;
        if(!v["d_"+i]) return `Row ${i+1} needs a date.`;
        recs.push({id:uid(),date:v["d_"+i],source:v.source.trim(),amount:Math.round(a*100)/100,gross:0});
      }
      if(!recs.length) return "Fill in at least one amount.";
      S.data.income.push(...recs);
      S.month=ymOf(recs[recs.length-1].date); S.view="money"; S.sub="income";
      save(); render(); toast(`Added ${recs.length} paycheck${recs.length>1?"s":""}, ${money(sum(recs))} total`);
    }});
  bulkRegen();

function bulkRegen(freqChanged){
  const pn=$(".overlay .panel"); if(!pn) return;
  const freq=$('[name="freq"]',pn).value, fromI=$('[name="from"]',pn), toI=$('[name="to"]',pn);
  if(freqChanged){const [f,t]=bulkDefaults(freq);fromI.value=f;toI.value=t;}
  const keep={}; pn.querySelectorAll(".brow").forEach(r=>{const d=$('input[type=date]',r).value,a=$("[data-bulkamt]",r).value;if(d&&a)keep[d]=a;});
  let dates=genDates(freq,fromI.value,toI.value), more=dates.length>BULK_MAX; if(more) dates=dates.slice(0,BULK_MAX);
  const lab=freq==="month"?d=>new Date(d+"T12:00").toLocaleDateString("en-US",{month:"long"}):null;
  $("#bulkRows",pn).innerHTML=!dates.length?`<p class="err">Set a "To" date on or after the "From" date.</p>`:
    dates.map((d,i)=>`<div class="brow"><input type="date" name="d_${i}" value="${d}" aria-label="Date for row ${i+1}"><div class="pct"><span class="muted">$</span><input name="a_${i}" inputmode="decimal" data-bulkamt value="${esc(keep[d]||"")}" placeholder="${lab?lab(d):"0.00"}" aria-label="Amount for ${shortDate(d)}"></div></div>`).join("")+
    (more?`<p class="small muted">Showing the first ${BULK_MAX} rows. Pick a shorter range for more.</p>`:"");
  bulkTotal();
}
function bulkTotal(){
  const pn=$(".overlay .panel"); if(!pn||!$("#bulkTot",pn)) return;
  let n=0,t=0; pn.querySelectorAll("[data-bulkamt]").forEach(i=>{const a=parseMoney(i.value);if(a>0){n++;t+=a;}});

/* ---------- sheets ---------- */
function closeSheet(){const o=$(".overlay");if(o)o.remove();}
function sheet({title,body,primary="Save",primaryClass="primary",onSave,onDelete,deleteLabel="Delete",noPrimary=false,cancelLabel="Cancel"}){
  closeSheet();
  const o=document.createElement("div");o.className="overlay";
  o.innerHTML=`<div class="panel" role="dialog" aria-modal="true" aria-label="${esc(title)}"><h2>${esc(title)}</h2><div class="sb">${body}</div>
    <div class="sheet-btns">${onDelete?`<button class="btn quiet danger-t" data-sd>${esc(deleteLabel)}</button>`:""}<span class="sp"></span>
    <button class="btn" data-sc>${esc(noPrimary?"Done":cancelLabel)}</button>${noPrimary?"":`<button class="btn ${primaryClass}" data-ss>${esc(primary)}</button>`}</div><p class="err" data-se></p></div>`;
  document.body.appendChild(o);
  const err=m=>{$("[data-se]",o).textContent=m||"";};
  const doSave=async()=>{
    if(!onSave){closeSheet();return;}
    const vals={};o.querySelectorAll("[name]").forEach(el=>{vals[el.name]=el.type==="checkbox"?el.checked:el.value;});
    const btn=$("[data-ss]",o); if(btn) btn.disabled=true;
    let r; try{r=await onSave(vals,o);}catch(e){r="Something went wrong: "+e.message;}
    if(btn) btn.disabled=false;
    if(typeof r==="string"){err(r);return;}
    if(r!==false) closeSheet();
  };
  o.addEventListener("click",async e=>{
    if(e.target===o||e.target.closest("[data-sc]")){closeSheet();return;}
    if(e.target.closest("[data-ss]")){doSave();return;}
    if(e.target.closest("[data-sd]")){const r=await onDelete(); if(r!==false) closeSheet();}
  });
  o.addEventListener("keydown",e=>{if(e.key==="Enter"&&e.target.matches("input:not([type=checkbox])")){e.preventDefault();doSave();}});
  const first=o.querySelector("input:not([type=hidden]):not([type=checkbox]),select"); if(first&&!noPrimary) setTimeout(()=>first.focus(),60);
  return o;
}
function confirmSheet(title,text,label,danger){
  return new Promise(res=>{
    let done=false;
    sheet({title,body:`<p class="muted" style="margin:0">${text}</p>`,primary:label,primaryClass:danger?"danger":"primary",
      onSave:()=>{done=true;res(true);}});
    const o=$(".overlay"); const mo=new MutationObserver(()=>{if(!document.body.contains(o)){mo.disconnect();if(!done)res(false);}});
    mo.observe(document.body,{childList:true});
  });
}

/* ---------- CSV import ---------- */
function parseCSV(t){
  const rows=[];let row=[],f="",q=false;
  for(let i=0;i<t.length;i++){const c=t[i];
    if(q){if(c==='"'){if(t[i+1]==='"'){f+='"';i++;}else q=false;}else f+=c;}
    else if(c==='"')q=true; else if(c===","){row.push(f);f="";} else if(c==="\n"){row.push(f);rows.push(row);row=[];f="";} else if(c!=="\r")f+=c;}
  if(f!==""||row.length){row.push(f);rows.push(row);}
  return rows.filter(r=>r.some(x=>x.trim()!==""));
}
function readCsv(text){
  const rows=parseCSV(text.replace(/^\uFEFF/,""));
  const hi=rows.findIndex(r=>r.some(c=>/date/i.test(c)));
  if(hi<0) return {error:"Couldn't find a Date column. Check that the file has a header row."};
  const h=rows[hi].map(c=>c.trim().toLowerCase());
  const find=re=>h.findIndex(c=>re.test(c));
  const di=find(/date/), desc=find(/desc|merchant|payee|name|memo|details|instrument/), ai=find(/amount/), deb=find(/debit|withdraw/), cre=find(/credit|deposit/);
  if(ai<0&&deb<0) return {error:"Couldn't find an Amount column."};
  const out=[];
  for(const r of rows.slice(hi+1)){
    const date=parseDate(r[di]); if(!date) continue;
    let amt; if(ai>=0) amt=parseMoney(r[ai]); else {const d=parseMoney(r[deb]),c=parseMoney(r[cre]);amt=(isNaN(c)?0:Math.abs(c))-(isNaN(d)?0:Math.abs(d));}
    if(isNaN(amt)||amt===0) continue;
    out.push({date,desc:desc>=0?(r[desc]||"").trim():"",amount:amt});
  }
  if(!out.length) return {error:"No transactions with a date and amount were found."};
  return {rows:out};
}
function importSheet(rows){
  const hasNeg=rows.some(r=>r.amount<0);
  sheet({title:"Import transactions",
    body:`<p class="muted" style="margin:0 0 10px">Found ${rows.length} rows from ${shortDate(rows.reduce((a,r)=>r.date<a?r.date:a,"9999"))} to ${shortDate(rows.reduce((a,r)=>r.date>a?r.date:a,""))}. The file is read on this phone and never uploaded.</p>
      <label class="chk"><input type="checkbox" name="flip" ${hasNeg?"":"checked"}><span>Charges are positive numbers in this file<br><span class="small muted">Credit card exports often work this way. Leave unticked if spending shows as negative.</span></span></label>
      <label class="chk"><input type="checkbox" name="deposits"><span>Also add deposits as paychecks</span></label>
      ${field("Put new expenses in",`<select name="category">${catOptions("").replace("Choose a category","Needs a category (sort later)")}</select>`)}`,
    primary:"Import",
    onSave:v=>{
      const seen=new Set(S.data.expenses.map(e=>e.date+"|"+e.amount+"|"+e.desc));
      const seenIn=new Set(S.data.income.map(i=>i.date+"|"+i.amount));
      let ne=0,ni=0,dup=0;
      for(const r of rows){
        const out=v.flip?r.amount>0:r.amount<0; const amt=Math.round(Math.abs(r.amount)*100)/100;
        if(out){const k=r.date+"|"+amt+"|"+r.desc;if(seen.has(k)){dup++;continue;}seen.add(k);S.data.expenses.push({id:uid(),date:r.date,desc:r.desc,category:v.category,amount:amt});ne++;}
        else if(v.deposits){const k=r.date+"|"+amt;if(seenIn.has(k)){dup++;continue;}seenIn.add(k);S.data.income.push({id:uid(),date:r.date,source:r.desc||"Deposit",amount:amt,gross:0});ni++;}
      }
      save(); render(); toast(`Imported ${ne} expense${ne===1?"":"s"}${ni?` and ${ni} paycheck${ni===1?"":"s"}`:""}${dup?`, skipped ${dup} duplicate${dup===1?"":"s"}`:""}`);
    }});
}


/* ---------- private cloud save (backs up this device's copy) ---------- */
const TS_KEY=STORE_KEY+".ts", CLOUD_KEY="tally.demo.cloud", CHUNK=180000;
const C={db:null,base:"",ready:false,status:"Connecting…",t:null,last:0,busy:false};
function cloudOn(){try{return localStorage.getItem(CLOUD_KEY)!=="off";}catch(e){return true;}}
function setCloudOn(v){try{localStorage.setItem(CLOUD_KEY,v?"on":"off");}catch(e){}}
function localTs(){try{return +localStorage.getItem(TS_KEY)||0;}catch(e){return 0;}}
function setLocalTs(t){try{localStorage.setItem(TS_KEY,String(t));}catch(e){}}
function cloudPush(){if(!C.ready||!cloudOn())return;clearTimeout(C.t);C.t=setTimeout(pushNow,1200);}
async function pushNow(){
  if(!C.ready||!cloudOn()) return;
  if(C.busy){cloudPush();return;}
  const raw=readRaw(); if(raw==null) return;
  C.busy=true;
  try{
    const n=Math.max(1,Math.ceil(raw.length/CHUNK));
    for(let i=0;i<n;i++) await C.db.doc(C.base+"/c"+i).set({s:raw.slice(i*CHUNK,(i+1)*CHUNK)});
    await C.db.doc(C.base+"/meta").set({updatedAt:localTs()||Date.now(),chunks:n,v:1});
    C.last=Date.now(); C.status="ok";
  }catch(e){C.status="Couldn't reach cloud save ("+((e&&e.code)||"error")+"). Your data is still on this device.";}
  C.busy=false;
}
async function cloudPull(){
  const m=await C.db.doc(C.base+"/meta").get();
  const md=m.exists?m.data():null, lt=localTs(), hasLocal=readRaw()!=null;
  if(md&&(!hasLocal||(+md.updatedAt||0)>lt)){
    let raw="";
    for(let i=0;i<md.chunks;i++){const c=await C.db.doc(C.base+"/c"+i).get();if(!c.exists)throw {code:"incomplete"};raw+=c.data().s;}
    JSON.parse(raw);
    writeRaw(raw); setLocalTs(+md.updatedAt||Date.now());
    S.key=null;S.salt=null;S.data=null;S.pending=null; closeSheet(); load();
    C.last=Date.now(); C.status="ok"; toast("Your budget was restored from cloud save");
    return;
  }
  if(hasLocal&&(!md||lt>(+md.updatedAt||0))) await pushNow(); else {C.status="ok";C.last=Date.now();}
}
async function cloudDelete(){
  if(!C.ready) return;
  try{const m=await C.db.doc(C.base+"/meta").get();const n=m.exists?(+m.data().chunks||1):1;await C.db.doc(C.base+"/meta").delete();for(let i=0;i<n;i++)await C.db.doc(C.base+"/c"+i).delete();}catch(e){}
}
async function cloudInit(){
  try{ if(navigator.storage&&navigator.storage.persist) navigator.storage.persist().catch(()=>{}); }catch(e){}
  if(!(window.claude&&typeof window.claude.use==="function")){C.status="Not available when the app is opened outside claude.ai.";return;}
  try{
    const [db,user]=await Promise.all([window.claude.use("db"),window.claude.use("user")]);
    if(!db||!user){C.status="Not available in this view.";return;}
    const id=await user.id(); if(!id){C.status="Sign in to claude.ai to use cloud save.";return;}
    C.db=db; C.base="data/users/"+id; C.ready=true;
    if(!cloudOn()){C.status="off";return;}
    await cloudPull();
  }catch(e){C.status="Couldn't reach cloud save right now. Your data is still on this device.";}
}
function cloudStatusHtml(){
  if(!C.ready) return `<p class="small muted" style="margin:0">${esc(C.status)}</p>`;
  if(!cloudOn()) return `<p class="small muted" style="margin:0 0 8px">Off. Your budget lives only in this browser, so clearing browser data erases it.</p><button class="btn primary" data-act="cloudOnB">Turn on cloud save</button>`;
  const when=C.last?new Date(C.last).toLocaleTimeString("en-US",{hour:"numeric",minute:"2-digit"}):"";
  return `<p class="small muted" style="margin:0 0 8px">On. ${C.status==="ok"?`Last synced ${when}.`:esc(C.status)} Your budget is copied to private storage tied to your Claude account, so it comes back if this browser gets cleared and shows up on any device where you open this link signed in. Nobody else who opens the link can see it.${S.key?" With your passcode on, only an encrypted copy is stored, which can't be read without your passcode.":" Turn on a passcode below so only an encrypted copy is stored."}</p>
    <div class="btns"><button class="btn" data-act="cloudSyncB">Sync now</button><button class="btn quiet danger-t" data-act="cloudOffB">Turn off and delete cloud copy</button></div>`;
}
/* ---------- settings & privacy ---------- */
function settingsSheet(){
  const on=!!S.key;
  sheet({title:"Privacy and backup",noPrimary:true,
    body:`<h3 style="margin-top:0">Cloud save</h3>${cloudStatusHtml()}
    <h3>Passcode</h3>
    ${!hasCrypto?`<p class="small muted">This browser doesn't support encryption.</p>`:on?
      `<p class="small muted" style="margin:0 0 8px">On. Your data is encrypted with AES-256 and locks after 5 minutes away.</p><div class="btns"><button class="btn" data-act="lockNow">Lock now</button><button class="btn" data-act="setPass">Change</button><button class="btn quiet danger-t" data-act="removePass">Turn off</button></div>`:
      `<p class="small muted" style="margin:0 0 8px">Add a passcode to encrypt everything stored on this phone.</p><button class="btn primary" data-act="setPass">Set passcode</button>`}
    <h3>Backup</h3>
    <p class="small muted" style="margin:0 0 8px">Clearing browser data erases your budget, so save a backup now and then.${on?" Backups stay encrypted with your passcode.":""}</p>
    <div class="btns"><button class="btn" data-act="exportB">Save backup</button><button class="btn" data-act="restoreB">Restore backup</button></div>
    <h3>Start over</h3>
    <button class="btn quiet danger-t" data-act="erase">Erase all data${C.ready&&cloudOn()?", including the cloud copy":" on this phone"}</button>`});
}
function passSheet(){
  sheet({title:S.key?"Change passcode":"Set a passcode",
    body:field("New passcode",`<input name="p1" type="password" autocomplete="new-password">`)+field("Type it again",`<input name="p2" type="password" autocomplete="new-password">`)+
      `<p class="small muted" style="margin:0">If you forget it, your data can't be recovered. Write it down somewhere safe.</p>`,
    primary:"Save passcode",
    onSave:async v=>{
      if(v.p1.length<4) return "Use at least 4 characters.";
      if(v.p1!==v.p2) return "The two passcodes don't match.";
      S.salt=crypto.getRandomValues(new Uint8Array(16)); S.key=await deriveKey(v.p1,S.salt);
      await flush(); toast("Passcode saved. Data encrypted.");
    }});
}
async function exportBackup(){
  await flush();
  const raw=readRaw()||JSON.stringify(S.data), name="tally-backup-"+today()+".json";
  const dl=await dlPromise;
  if(dl){try{await dl.save({filename:name,data:raw});toast("Backup saved");}catch(e){if(e&&e.code!=="declined")toast("Couldn't save a file here.");}return;}
  const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([raw],{type:"application/json"}));a.download=name;document.body.appendChild(a);a.click();a.remove();
}

  delCat:async t=>{const c=catById(t.dataset.id);const n=S.data.expenses.filter(e=>e.category===c.id).length;

  preset:async t=>{const p=t.dataset.p;

    save();render();toast("Plan updated");},
  settings:()=>settingsSheet(), setPass:()=>passSheet(),
  removePass:async()=>{if(!(await confirmSheet("Turn off passcode?","Your data will be stored on this phone without encryption.","Turn off",true)))return;S.key=null;S.salt=null;await flush();toast("Passcode off");},
  lockNow:()=>lockNow(), unlock:()=>unlock(),
  exportB:()=>exportBackup(), restoreB:()=>{$("#backupFile").value="";$("#backupFile").click();},
  erase:async()=>{if(!(await confirmSheet("Erase everything?","Paychecks, expenses, your plan and accounts will be deleted from this phone. This can't be undone.","Erase all",true)))return;
    try{localStorage.removeItem(STORE_KEY);localStorage.removeItem(TS_KEY);}catch(e){} await cloudDelete(); S.key=null;S.salt=null;S.data=freshData();render();toast("All data erased");},
  cloudOnB:async()=>{setCloudOn(true);closeSheet();await flush();await pushNow();settingsSheet();toast("Cloud save is on");},
  cloudOffB:async()=>{if(!(await confirmSheet("Turn off cloud save?","The cloud copy is deleted and your budget lives only in this browser. Clearing browser data will erase it, so keep a backup.","Turn off",true)))return;
    setCloudOn(false);await cloudDelete();settingsSheet();toast("Cloud save off, cloud copy deleted");},
  cloudSyncB:async()=>{await flush();await pushNow();settingsSheet();toast(C.status==="ok"?"Synced":"Couldn't sync right now");},
  forgot:async()=>{$("#lock").classList.remove("on");
    const ok=await confirmSheet("Erase and start over?","Without the passcode the encrypted data can't be opened. You can erase it and start fresh, or restore a backup afterward.","Erase all",true);
    if(ok){try{localStorage.removeItem(STORE_KEY);localStorage.removeItem(TS_KEY);}catch(e){} await cloudDelete(); S.pending=null;S.data=freshData();render();} else showLock();}
};
